{% for ubic in ubicaciones %}
<div class="list-group-item list-group-item-action" style="cursor:pointer;"
     onclick="seleccionarUbicacion('{{ ubic.pk }}', '{{ ubic.codigo_completo|escapejs }}')">
    {{ ubic.codigo_completo }}
    <span class="badge ms-1 {% if ubic.nivel.tipo == 'PICKING' %}bg-info text-dark{% else %}bg-secondary{% endif %}">
        {{ ubic.nivel.get_tipo_display }}
    </span>
</div>
{% empty %}
<div class="list-group-item text-muted">No se encontraron ubicaciones.</div>
{% endfor %}
