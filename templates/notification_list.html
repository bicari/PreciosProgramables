
<body style="font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4;">

    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 20px; margin-bottom: 20px;">
        
        <h1 style="color: #2c3e50; text-align: center; margin-top: 0; font-size: 24px;">
            ¡Tarea Creada Exitosamente! ✅
        </h1>
        
        <p style="color: #555555; font-size: 16px; line-height: 1.5; text-align: center; margin-bottom: 30px;">
            Se ha generado una nueva lista de precios en el sistema y está en proceso de ejecución.
        </p>
        
        <div style="background-color: #e8f5e9; border-left: 5px solid #4caf50; padding: 25px; margin: 25px 0; text-align: center; border-radius: 4px;">
            
            <p style="margin: 0; color: #1b5e20; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">
                Número de Lista
            </p>
            
            <p style="margin: 10px 0 0 0; font-size: 32px; font-weight: bold; color: #2e7d32;">
                #{{ task_number }}
            </p>

            <p style="margin: 0; color: #1b5e20; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;">
                Usuario Responsable
            </p>
            <p style="margin: 10px 0 0 0; font-size: 32px; font-weight: bold; color: #2e7d32;">
                #{{ user_name }}
            </p>
        </div>
        
        <div style="margin-top: 40px; border-top: 1px solid #eeeeee; padding-top: 20px; text-align: center;">
            <p style="font-size: 12px; color: #999999; margin: 0;">
                Notificación generada automáticamente.
            </p>
        </div>

    </div>

</body>
